components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vectra_session
      description: Web-Sitzung (ADR-015); zustandsändernde Requests zusätzlich mit CSRF-Header `X-CSRF-Token`
    bearerToken:
      type: http
      scheme: bearer
      description: Access-Token der Android-App oder persönliches API-Token (nur Header)
  parameters:
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReadingId:
      name: reading_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FillId:
      name: fill_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TripId:
      name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoteId:
      name: note_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: import_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageId:
      name: image_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
      description: Kalenderdatum, inklusive
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
      description: Kalenderdatum, inklusive
    IncludeDeleted:
      name: include_deleted
      in: query
      schema:
        type: boolean
        default: false
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag der gelesenen Version (ADR-012); fehlt → 428, veraltet → 412
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 128
      description: Für Aktionen ohne eigene ID (ADR-012); Ergebnis 24 h wiederholbar
  responses:
    BadRequest:
      description: Ungültige Anfrage
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Nicht angemeldet
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Rolle oder Token-Scope reicht nicht (ID-01)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Nicht vorhanden oder ohne Leserecht (ADR-013)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Konflikt mit Invarianten oder Idempotenz (ADR-006, ADR-012)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Version veraltet; Problem enthält `current`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match fehlt
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validierung oder Plausibilität (ADR-010); `anomalies` listet bestätigbare Befunde
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate-Limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
    NoContent:
      description: Erfolgreich, ohne Inhalt
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: Problemtyp, z. B. https://vectra.app/problems/plausibility
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/Anomaly'
        current:
          description: 'Bei 412: aktueller Stand der Ressource für den Konfliktdialog (ADR-012, ADR-021)'
      required:
      - type
      - title
      - status
      description: RFC 9457 Problem Details (ADR-013)
    FieldError:
