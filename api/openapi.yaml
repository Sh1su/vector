# Vectra API – OpenAPI 3.1 (Entwurf, Phase 2 AP-6). Maßgeblich ist diese Datei (ADR-014).
openapi: 3.1.0
info:
  title: Vectra API
  version: 1.0.0-draft.1
  summary: Öffentliche API von Vectra (Phase 2, AP-6, Entwurf)
  description: |-
    Spezifikation vor Implementierung (ADR-014). Konventionen: ADR-013 (JSON, snake_case, RFC 9457, Cursor-Paginierung, JSON Merge Patch mit If-Match). Einheiten: ADR-007; Zeit: ADR-008; Geld: ADR-029; Rechte: ADR-016 / ID-01.

    **Erweiterungen:** `x-vectra-role` = mindestens nötige Rolle am Fahrzeug (`viewer`, `editor`, `editor-delete`, `owner`, `owner-delete`) bzw. `self`/`admin`/`public`; `x-vectra-scope` = nötiger API-Token-Scope. Die CI verweigert Operationen ohne diese Angaben (deny-by-default).

    **Nicht Teil dieses Entwurfs:** Assistant-Endpunkte (AP-10, ADR-026).
  license:
    name: Proprietär – Lizenz wird vor Veröffentlichung festgelegt
    identifier: LicenseRef-Vectra-TBD
servers:
- url: /api/v1
tags:
- name: Identity
  description: Konten, Anmeldung, Sitzungen, API-Tokens (ADR-015, 10-domaene-identity)
- name: Sharing
  description: Mitglieder und Einladungen je Fahrzeug (ADR-016)
- name: Vehicles
  description: Fahrzeuge, Dashboard (10-domaene-vehicles)
- name: Odometer
  description: Messpunkte, Zählerabschnitte, Stand und Distanz (ADR-009, 10-domaene-odometer)
- name: Fuel
  description: Tank- und Ladevorgänge, Verbrauch (10-domaene-fuel)
- name: Oil
  description: Ölstand, Nachfüllung, Ölwechsel (10-domaene-oil)
- name: Trips
  description: Fahrten mit Korrekturfassungen (10-domaene-trips)
- name: Maintenance
  description: Wartungsdefinitionen und Fälligkeit (10-domaene-maintenance)
- name: ServiceHistory
  description: Wartung, Inspektion, Reparatur, Nachrüstung (10-domaene-servicehistory)
- name: Costs
  description: Sonstige Kosten, Kostenpläne, Auswertungen (10-domaene-costs)
- name: Documents
  description: Dateien, Fahrzeugakte, Verknüpfungen (ADR-017/018)
- name: Notes
  description: Notizen (10-domaene-notes)
- name: Notifications
  description: Benachrichtigungswünsche, Push-Geräte, Webhooks (ADR-020)
- name: Import
  description: Migration aus LubeLogger und CSV (ADR-027, 30-migrationskonzept)
- name: Audit
  description: Änderungshistorie (ADR-011)
- name: Sync
  description: Änderungsfeed für Offline-Clients (ADR-021)
- name: Admin
  description: Verwaltung der Installation
- name: Operations
  description: Betrieb
security:
- sessionCookie: []
- bearerToken: []
paths:
  /auth/setup:
    post:
      operationId: setupInstallation
      summary: 'Ersteinrichtung: erstes Admin-Konto anlegen'
      tags:
      - Identity
      description: Nur mit Einmal-Setup-Token und nur solange kein Konto existiert (ADR-015).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-vectra-role: public
  /auth/login:
    post:
      operationId: login
      summary: Anmeldung mit E-Mail und Passwort (Web-Sitzung)
      tags:
      - Identity
      description: Setzt das Sitzungs-Cookie (HttpOnly, Secure, SameSite=Lax). Fehlversuche werden gedrosselt (ID-03).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-vectra-role: public
  /auth/logout:
    post:
      operationId: logout
      summary: Abmelden (aktuelle Sitzung beenden)
      tags:
      - Identity
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      x-vectra-role: self
  /auth/oidc/start:
    get:
      operationId: startOidcLogin
      summary: OIDC-Anmeldung starten (Weiterleitung zum IdP, PKCE)
      tags:
      - Identity
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Weiterleitung
          headers:
            Location:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-vectra-role: public
  /auth/oidc/callback:
    get:
      operationId: completeOidcLogin
      summary: OIDC-Rückkehr (Code-Austausch, Prüfung von state/nonce)
      tags:
      - Identity
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Weiterleitung
          headers:
            Location:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-vectra-role: public
  /auth/token:
    post:
      operationId: exchangeToken
      summary: OAuth2-Token-Endpunkt für die Android-App (PKCE, Refresh-Rotation)
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-vectra-role: public
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Link zum Zurücksetzen anfordern (Antwort immer 204)
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-vectra-role: public
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Neues Passwort mit Reset-Token setzen
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-vectra-role: public
  /me:
    get:
      operationId: getMe
      summary: Eigenes Konto
      tags:
      - Identity
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
    patch:
      operationId: updateMe
      summary: Eigenes Konto ändern
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
    delete:
      operationId: deleteMe
      summary: Eigenes Konto löschen (ID-05)
      tags:
      - Identity
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      x-vectra-role: self
  /me/password:
    post:
      operationId: changePassword
      summary: Passwort ändern (beendet alle anderen Sitzungen)
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      x-vectra-role: self
  /me/settings:
    get:
      operationId: getSettings
      summary: Nutzereinstellungen
      tags:
      - Identity
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
    patch:
      operationId: updateSettings
      summary: Nutzereinstellungen ändern
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
  /me/sessions:
    get:
      operationId: listSessions
      summary: Eigene Sitzungen
      tags:
      - Identity
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
  /me/sessions/{session_id}:
    delete:
      operationId: revokeSession
      summary: Sitzung beenden
      tags:
      - Identity
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
  /me/api-tokens:
    get:
      operationId: listApiTokens
      summary: Eigene API-Tokens
      tags:
      - Identity
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
    post:
      operationId: createApiToken
      summary: API-Token anlegen (Klartext nur in dieser Antwort)
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiToken'
      responses:
        '201':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
            Location:
              schema:
                type: string
        '200':
          description: Idempotente Wiederholung mit gleicher ID und gleichem Inhalt (ADR-006)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      x-vectra-role: self
  /me/api-tokens/{token_id}:
    delete:
      operationId: revokeApiToken
      summary: API-Token widerrufen
      tags:
      - Identity
      parameters:
      - $ref: '#/components/parameters/TokenId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
  /me/invitations:
    get:
      operationId: listMyInvitations
      summary: An mich gerichtete offene Einladungen
      tags:
      - Identity
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Einladung annehmen
      tags:
      - Identity
      description: E-Mail des angemeldeten Kontos muss zur Einladung passen (ID-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
  /invitations/decline:
    post:
      operationId: declineInvitation
      summary: Einladung ablehnen
      tags:
      - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: self
  /vehicles/{vehicle_id}/members:
    get:
      operationId: listMembers
      summary: Mitglieder eines Fahrzeugs
      tags:
      - Sharing
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: viewer
      x-vectra-scope: vehicles:read
  /vehicles/{vehicle_id}/members/{account_id}:
    patch:
      operationId: changeMemberRole
      summary: Rolle ändern (letzter Eigentümer geschützt)
      tags:
      - Sharing
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatch'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          headers:
            ETag:
              schema:
                type: string
              description: Version der Ressource
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: owner
      x-vectra-scope: sharing:manage
    delete:
      operationId: removeMember
      summary: Mitglied entfernen oder Fahrzeug verlassen
      tags:
      - Sharing
      description: Eigentümer dürfen andere entfernen; jedes Mitglied darf sich selbst entfernen. Letzter Eigentümer → 409.
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: viewer
      x-vectra-scope: vehicles:read
  /vehicles/{vehicle_id}/invitations:
    get:
      operationId: listInvitations
      summary: Offene Einladungen des Fahrzeugs
      tags:
      - Sharing
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Erfolg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - sessionCookie: []
      - bearerToken: []
      x-vectra-role: owner
      x-vectra-scope: sharing:manage
    post:
      operationId: createInvitation
      summary: Einladung versenden
      tags:
      - Sharing
      parameters:
      - $ref: '#/components/parameters/VehicleId'
      requestBody:
